version: '3'

# 构建期公用任务。只面向 Windows，所以平台差异全在 build/windows/Taskfile.yml。
#
# 这里不写 darwin / linux / ios / docker / msix：那些任务在本项目里永远不会被执行，
# 留着只是让「这个项目支持什么平台」这件事变得含糊。

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    run: once
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies
    run: once
    cmds:
      - task: install:frontend:deps:npm

  install:frontend:deps:npm:
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    preconditions:
      - sh: npm version
        msg: "npm 没装。构建机需要 Node.js；运行时用的是随包内置的那份。"
    cmds:
      - npm install

  build:frontend:
    summary: Build the frontend production bundle
    # run:once：dev 模式会并行跑两次（一次出 dist，一次给 Vite），
    # 不加它两个进程会同时删改 frontend/bindings，间歇性失败。
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
    cmds:
      - npm run {{if eq .DEV "true"}}build:dev{{else}}build{{end}} -q
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  dev:frontend:
    summary: Runs the frontend in development mode
    dir: frontend
    deps:
      - task: install:frontend:deps
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort

  generate:bindings:
    summary: Generates bindings for the frontend
    run: once
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      - exclude: frontend/**/*
    generates:
      - frontend/bindings/**/*
    cmds:
      # -clean 会先清空输出目录：生成物的目录名跟着后端包的位置走
      # （shell 在 backend/ 下就是 bindings/WorkBaby/backend/shell）。
      # 前端的 import 必须跟着它走。
      - wails3 generate bindings -clean=true -ts -i

  generate:icons:
    # 只面向 Windows：只出 .ico，不碰 mac 资产。
    summary: Generates the Windows `.ico` from `build/appicon.png`
    run: once
    sources:
      - "build/appicon.png"
    generates:
      - "build/windows/icon.ico"
    cmds:
      - wails3 generate icons -input build/appicon.png -windowsfilename build/windows/icon.ico

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
