version: '3'

# 构建期公用任务。只面向 Windows，所以平台差异全在 build/windows/Taskfile.yml。
#
# 这里不写 darwin / linux / ios / docker / msix：那些任务在本项目里永远不会被执行，
# 留着只是让「这个项目支持什么平台」这件事变得含糊。

tasks:
  go:mod:tidy:
    summary: 整理 go.mod
    internal: true
    run: once
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: 装前端依赖（Node 只在构建期用，不随包分发）
    run: once
    cmds:
      - task: install:frontend:deps:npm

  install:frontend:deps:npm:
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    preconditions:
      - sh: npm version
        msg: "npm 没装。构建机需要 Node.js（只用于构建前端）；运行时不随包分发。"
    cmds:
      - npm install

  build:frontend:
    summary: 出前端生产产物（frontend\dist）
    # run:once：dev 模式会并行跑两次（一次出 dist，一次给 Vite），
    # 不加它两个进程会同时删改 frontend/bindings，间歇性失败。
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
    cmds:
      - npm run {{if eq .DEV "true"}}build:dev{{else}}build{{end}} -q
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  dev:frontend:
    summary: 起 Vite 开发服务
    dir: frontend
    deps:
      - task: install:frontend:deps
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort

  generate:bindings:
    summary: 生成前端 TypeScript 绑定
    run: once
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      - exclude: frontend/**/*
    generates:
      - frontend/bindings/**/*
    cmds:
      # -clean 会先清空输出目录：生成物的目录名跟着后端包的位置走
      # （shell 在 backend/ 下就是 bindings/WorkBaby/backend/shell）。
      # 前端的 import 必须跟着它走。
      - wails3 generate bindings -clean=true -ts -i

  icons:
    summary: 重生成全套图标（build\appicon.png 与主稿设计参数 → 四处 ico/png 产物）
    cmds:
      # 图标不进构建流水线：产物是提交进仓库的 ico/png，每次构建都重画只会把 diff 变成噪声。
      # 改主稿或字标后手动跑一次，把新产物一起提交。
      - powershell -NoProfile -ExecutionPolicy Bypass -File {{.ROOT_DIR}}/build/tools/make-icons.ps1
