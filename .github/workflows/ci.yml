name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: 格式 · 静态检查 · 测试 · 构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 格式检查
        shell: pwsh
        run: |
          $bad = gofmt -l backend main.go tests
          if ($bad) {
            Write-Host "未格式化："
            Write-Host $bad
            exit 1
          }

      # setup-go 不保证把 GOPATH\bin 加进 PATH，而 wails3 就装在那里。
      - name: GOPATH\bin 加入 PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH (Join-Path (go env GOPATH) 'bin')

      - name: 安装 wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      # vue-tsc 与 vite 都要 import @wails/* 的生成绑定；绑定不进仓库，现场生成。
      - name: 生成前端绑定
        run: wails3 generate bindings -clean=true -ts -i

      # main.go 的 go:embed all:frontend/dist 在全新 checkout 下不存在，
      # 任何编译 package main 的命令（vet/test/build）都必须排在前端产物之后。
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 前端类型检查与产物
        working-directory: frontend
        run: npm run build

      - name: 静态检查
        run: go vet ./...

      - name: 测试
        run: go test ./tests -count=1

      - name: 主机构建
        run: go build ./...
