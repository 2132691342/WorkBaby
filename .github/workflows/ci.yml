# 质量门禁：push main / PR 上跑完整验证链（gofmt + 前端构建 + vet + 依赖边界 + 全量测试）。
# 只验证、从不发版：发版只由 release.yml 在 tag 上触发。
name: ci

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 内置运行时归档走 Git LFS：embed 的是指针文本时构建会成功但运行时不可用。
          lfs: true
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # 与内置 Node 同一大版本：CI 验的就是用户拿到的运行时组合。
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        # main 包 //go:embed frontend/dist：不先建前端，go build 直接失败。
        run: npm run build
        working-directory: frontend

      - name: gofmt
        shell: pwsh
        run: |
          $bad = gofmt -l backend main.go app.go
          if ($bad) { Write-Host "未格式化（gofmt -w 后重提）："; Write-Host $bad; exit 1 }

      - name: vet
        run: go vet ./...

      - name: test
        # 全量：短测试与慢链路（真 git、运行时解压、真 PI 回合）都跑。
        run: go test ./... -count=1
