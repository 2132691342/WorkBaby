# 质量门禁：push main / PR 上跑完整验证链（gofmt + 前端构建 + vet + 依赖边界 + 全量测试）。
# 只验证、从不发版：发版只由 release.yml 在 tag 上触发。
name: ci

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 内置运行时归档走 Git LFS：embed 的是指针文本时构建会成功但运行时不可用。
          lfs: true
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # 与内置 Node 同一大版本：CI 验的就是用户拿到的运行时组合。
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Verify
        shell: pwsh
        # 与本机 scripts/check.ps1 -Full 同一条链：门禁只有一处实现，两边不会漂。
        # 失败摘要由脚本自己写进 job summary（子测试名 + .go 行号）。
        run: pwsh scripts/check.ps1 -Full
