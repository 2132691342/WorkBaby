# 质量门禁：push / PR 上跑完整验证链（vet + 依赖边界 + 全量测试 + 前端类型与构建）。
# 打包在 release.yml（只在 tag 触发）；设计与取名见 docs/DEPLOYMENT.md。

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 内置运行时归档走 Git LFS：embed 的是指针文本时构建会成功但运行时不可用。
          lfs: true
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Verify
        shell: pwsh
        # 与本地 scripts/check.ps1 -Full 同一条链：门禁只有一处实现，两边不会漂。
        # -v 让失败时能从输出直接看到是哪个子测试；不加 tee 到文件，故障摘要另见下一���。
        run: pwsh scripts/check.ps1 -Full

      - name: Summarize failures
        if: failure()
        shell: pwsh
        run: pwsh scripts/report-failures.ps1