name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: 类型检查 · 测试 · 构建
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装主进程依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 测试
        run: npx vitest run

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 构建（前端类型检查 + 产物 + 主进程产物）
        run: npm run build
