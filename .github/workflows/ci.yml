# GitHub Actions：push / PR 日常质量门禁。
#
# 与 release.yml 的分工：release 只在 tag 上出包；本文件在每次 push/PR 上跑
# 后端测试 + 依赖方向门禁 + 前端类型与构建，让回归在合并前暴露。
#
# 设计取舍：
#   - 仅 windows-latest：项目只面向 Windows。
#   - 后端 / 前端拆两个 job：两套工具链的失败互不拖累。
#   - 门禁排在 go test 之前：测试挂掉时依赖方向结论仍能拿到。
#   - go test 传 -short：跳过归档真实解压（全量唯一的慢点，见 AGENTS §3.3）。
#   - 不编译 / 不测 main 包：go:embed 依赖 frontend/dist，那份产物由 release 的 wails build 负责。
#     壳层逻辑（app_test.go）因此只在本地跑，改动 app.go 时记得本地执行。

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (go test + boundaries)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Setup Go（版本随 go.mod）
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./backend/...

      - name: gofmt（行尾与格式门禁）
        shell: pwsh
        run: |
          # .gitattributes 已把 *.go 固定为 LF：这里必须无输出，否则本地格式没对齐。
          $bad = gofmt -l .
          if ($bad) { throw "gofmt 未通过：`n$bad" }

      - name: go build（编译期验证，main 包留给 wails build）
        run: go build ./backend/...

      - name: 依赖方向门禁
        run: go run ./tools/check-boundaries

      - name: go test（-short 跳过归档解压）
        shell: pwsh
        run: |
          # 管道到 Tee-Object 之后，pwsh 的退出码不再反映 go test：
          # 必须显式取 $LASTEXITCODE，否则测试全红这一步也是绿的。
          go test -short -v ./backend/... 2>&1 | Tee-Object test-output.log
          if ($LASTEXITCODE -ne 0) { throw "go test failed" }
        if: always()

      # 失败时把失败行摘进 job summary：无需下载 artifact 就能看到原因。
      - name: 汇总测试失败
        if: failure()
        shell: pwsh
        run: |
          $log = Get-Content test-output.log -ErrorAction SilentlyContinue
          $bad = $log | Select-String -Pattern '^--- FAIL|^    --- FAIL|^FAIL\s|^panic:|\.go:\d+:' -Context 0,4
          $body = if ($bad) { $bad | Out-String } else { ($log | Select-Object -Last 40) -join "`n" }
          $md = "## go test 失败摘要`n`n``````text`n$body`n```````"
          Set-Content -Path $env:GITHUB_STEP_SUMMARY -Value $md -Encoding utf8
        continue-on-error: true

  frontend:
    name: Frontend (vue-tsc + build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci（严格 lockfile，规避子依赖漂移）
        run: npm ci

      - name: 类型检查 + 构建（vue-tsc + vite build）
        run: npm run build
