name: Release

# 打 v* tag 触发：构建 NSIS 安装包并发布 GitHub Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 构建安装包并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # wails3 用 git describe 取版本号，浅克隆会拿不到 tag

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # setup-go 不保证把 GOPATH\bin 加进 PATH，而 wails3 就装在那里。
      - name: GOPATH\bin 加入 PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH (Join-Path (go env GOPATH) 'bin')

      - name: 安装 wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: 校验 tag 与 git describe 一致
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $desc = git describe --tags --exact-match HEAD 2>$null
          if ($desc -ne $tag) {
            Write-Error "tag 与 HEAD 不匹配：tag=$tag describe=$desc"
            exit 1
          }
          Write-Output "版本一致：$tag"

      # go:embed all:frontend/dist 需要前端产物先就位，否则 go test 编译不过
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      # vue-tsc 与 vite 都要 import @wails/* 的生成绑定；绑定不进仓库，现场生成。
      - name: 生成前端绑定
        run: wails3 generate bindings -clean=true -ts -i

      - name: 前端类型检查与产物
        working-directory: frontend
        run: npm run build

      - name: 测试
        run: go test ./... -count=1

      - name: 打包 NSIS 安装器
        run: wails3 package

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Include *installer*.exe,*.exe -Path bin,build/windows/nsis -ErrorAction SilentlyContinue |
                   Where-Object { $_.Name -like '*WorkBaby*' } |
                   Select-Object -ExpandProperty FullName
          if (-not $files) { Write-Error "没找到安装包产物"; exit 1 }
          # 重打的 tag 会撞上已存在的 Release：有则覆盖上传，无则新建。
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $files --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $files --generate-notes
          }
