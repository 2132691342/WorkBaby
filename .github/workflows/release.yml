name: Release

# 打 v* tag 触发：构建 NSIS 安装包并发布 GitHub Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 构建安装包并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # wails3 用 git describe 取版本号，浅克隆会拿不到 tag

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: 校验 tag 与 git describe 一致
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $desc = git describe --tags --exact-match HEAD 2>$null
          if ($desc -ne $tag) {
            Write-Error "tag 与 HEAD 不匹配：tag=$tag describe=$desc"
            exit 1
          }
          Write-Output "版本一致：$tag"

      - name: 测试
        run: go test ./... -count=1

      - name: 打包 NSIS 安装器
        run: wails3 package -config ./build/config.yml

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Include *installer*.exe,*.exe -Path bin,build/windows/nsis -ErrorAction SilentlyContinue |
                   Where-Object { $_.Name -like '*WorkBaby*' } |
                   Select-Object -ExpandProperty FullName
          if (-not $files) { Write-Error "没找到安装包产物"; exit 1 }
          gh release create $env:GITHUB_REF_NAME $files --generate-notes
