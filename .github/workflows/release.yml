name: Release

# 打 v* tag 触发：构建 NSIS 安装包并发布 GitHub Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 构建安装包并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # wails3 用 git describe 取版本号，浅克隆拿不到 tag

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # NSIS 不在 windows-latest 的 PATH 上。没有 makensis，`wails3 package`
      # 会在最后一步失败（executable file not found in $PATH）。
      - name: 安装 NSIS
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      # setup-go 不保证把 GOPATH\bin 加进 PATH，而 wails3 就装在那里。
      - name: GOPATH\bin 加入 PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH (Join-Path (go env GOPATH) 'bin')

      - name: 安装 wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: 校验 tag 与 HEAD 一致
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $desc = git describe --tags --exact-match HEAD 2>$null
          if ($desc -ne $tag) {
            Write-Error "tag 与 HEAD 不匹配：tag=$tag describe=$desc"
            exit 1
          }
          Write-Output "版本一致：$tag"

      # go:embed all:frontend/dist 需要前端产物先就位，否则任何编译 package main 的命令都过不去。
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      # vue-tsc 与 vite 都要 import @wails/* 的生成绑定；绑定不进仓库，现场生成。
      - name: 生成前端绑定
        run: wails3 generate bindings -clean=true -ts -i

      - name: 前端类型检查与产物
        working-directory: frontend
        run: npm run build

      - name: 测试
        run: go test ./tests -count=1

      - name: 打包 NSIS 安装器
        run: wails3 package

      - name: 收集产物
        id: collect
        shell: pwsh
        run: |
          # 安装包由 NSIS 产出，落在 bin\ 下，文件名带 installer。
          $installer = Get-ChildItem -Path bin -Filter '*installer*.exe' -ErrorAction SilentlyContinue |
                       Select-Object -First 1
          if (-not $installer) {
            Write-Error "没找到安装包：bin\*installer*.exe"
            Get-ChildItem -Recurse -Include *.exe | Select-Object FullName
            exit 1
          }
          Write-Output "安装包：$($installer.FullName)（$([math]::Round($installer.Length/1MB)) MB）"
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALLER: ${{ steps.collect.outputs.installer }}
        shell: pwsh
        run: |
          # 重打的 tag 会撞上已存在的 Release：有则替换资产，无则新建。
          if (gh release view $env:GITHUB_REF_NAME 2>$null) {
            gh release upload $env:GITHUB_REF_NAME $env:INSTALLER --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $env:INSTALLER --generate-notes `
              --title $env:GITHUB_REF_NAME
          }
