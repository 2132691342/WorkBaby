name: Release

# 打 v* tag 触发：构建 NSIS 安装包并发布 GitHub Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 构建安装包并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 校验版本号一致
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne $tag) {
            Write-Error "版本不一致：tag=$tag 而 package.json version=$($pkg.version)"
            exit 1
          }
          Write-Output "版本一致：$tag"

      - name: 安装主进程依赖
        run: npm ci

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 打包并发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always
