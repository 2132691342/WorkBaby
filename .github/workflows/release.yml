# 发版：只由 tag 触发。push main / PR 不得触发本工作流——那是 ci.yml 的职责。
# 取名规则：WorkBaby 版本号跟随 PI 版本号（pi --version 的 major.minor）。
# tag 形如 v1.3.0，push 后同步到 main 保证 tag 能 checkout 到。

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:  # 手动触发：只验证流水线，不上传到 Release

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    env:
      EXE: build/bin/WorkBaby.exe
      INSTALLER: build/bin/WorkBaby-amd64-installer.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
          # tag 指向的 commit 必须先随 main 推过，否则子模块式 checkout 会失败。
          ref: ${{ github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install NSIS
        shell: pwsh
        # windows-latest(2025 镜像)不带 NSIS,只能现装;而 choco 社区源有间歇故障(HTTP 499/503,
        # 已知问题,见 keycloak/keycloak#28510)。策略:镜像预装则零网络直接用 → choco 重试 4 次 →
        # 仍失败用 NSIS 官方便携包兜底。makensis 必须在 PATH 上,wails build 才拿得到。
        run: |
          $ErrorActionPreference = 'Stop'
          $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
          function Use-Nsis([string]$dir) {
            if (-not (Test-Path "$dir\makensis.exe")) { return $false }
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            Write-Host ('makensis ' + (& "$dir\makensis.exe" /VERSION) + " @ $dir")
            return $true
          }
          if (Use-Nsis $nsisDir) { exit 0 }   # 预装镜像(windows-2022 等)零网络通过
          $ok = $false
          for ($i = 1; $i -le 4; $i++) {      # CCR 抖动重试,递增退避
            if ($i -gt 1) { Start-Sleep -Seconds (15 * $i) }
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -eq 0 -and (Use-Nsis $nsisDir)) { $ok = $true; break }
            Write-Warning "choco install nsis 第 $i 次尝试失败"
          }
          if (-not $ok) {                     # 兜底:官方发行便携 zip,版本随 NSIS 官方更新而 pin
            $ver = '3.13'
            $zip = "$env:RUNNER_TEMP\nsis-$ver.zip"
            curl.exe -L --fail --retry 3 -o "$zip" "https://downloads.sourceforge.net/project/nsis/NSIS%203/$ver/nsis-$ver.zip"
            Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\nsis" -Force
            if (-not (Use-Nsis "$env:RUNNER_TEMP\nsis\nsis-$ver")) { throw "NSIS 便携包不可用" }
          }

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Verify static gate
        shell: pwsh
        # 测试矩阵已由 main 上的 ci.yml 门禁（tag 必经 main）。这里只重验「编译与依赖方向」：
        # 重跑全量测试与独立 npm build 都是浪费（wails build 自己会跑前端）。
        run: |
          $bad = gofmt -l .
          if ($bad) { throw "gofmt 未通过:`n$bad" }
          go vet ./backend/...
          if ($LASTEXITCODE -ne 0) { throw "go vet 失败" }
          go build ./backend/...
          if ($LASTEXITCODE -ne 0) { throw "go build 失败" }
          go run ./tools/check-boundaries
          if ($LASTEXITCODE -ne 0) { throw "依赖方向门禁失败" }

      - name: Verify runtime archives
        shell: pwsh
        # 归档经 go:embed 进 exe：LFS 没拉下来时嵌的是指针文本，构建会成功而运行时不可用。
        run: |
          $patterns = @(
            'backend/runtime/bundled/python-*.zip',
            'backend/runtime/bundled/node-v*-win-x64.zip'
          )
          foreach ($pattern in $patterns) {
            $f = Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $f) { throw "缺少运行时归档 $pattern（git lfs pull 未执行？）" }
            $head = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($f.FullName), 0, 24)
            if ($head.StartsWith('version https://git-lfs')) {
              throw "运行时归档还是 LFS 指针，未取到真实文件: $($f.Name)"
            }
            Write-Host ("OK {0} {1:N1} MB" -f $f.Name, ($f.Length / 1MB))
          }

      - name: Wails build
        shell: pwsh
        # bindings 必须随构建生成（前端依赖 @/wailsjs）；-nsis 必填，缺了不产安装器。
        run: wails build -clean -platform windows/amd64 -trimpath -nsis

      - name: Verify artifacts
        shell: pwsh
        # exe 存在（含内嵌归档，故明显大于裸壳）+ 安装器真的产出。
        # NSIS 打包失败时 wails 仍可能返回 0，所以安装器要单独确认。
        run: |
          if (-not (Test-Path $env:EXE)) { throw "wails build 没产出 $([System.IO.Path]::GetFileName($env:EXE))" }
          if (-not (Test-Path $env:INSTALLER)) { throw "NSIS 安装器未产出 $([System.IO.Path]::GetFileName($env:INSTALLER))" }
          $exeMB = (Get-Item $env:EXE).Length / 1MB
          if ($exeMB -lt 55) { throw ("$([System.IO.Path]::GetFileName($env:EXE)) 只有 {0:N1} MB，运行时归档疑似没嵌进去" -f $exeMB) }
          Write-Host ("Artifacts OK (exe {0:N1} MB + installer)" -f $exeMB)

      - name: Upload failure diagnostics
        # 失败时保留产物供本地排查；成功后直接进 Release，不留重复 artifact。
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workbaby-windows-debug
          path: |
            build/bin/
            !build/bin/*.db
          retention-days: 7

      - name: Create GitHub Release
        # 双保险：触发条件已是 tag，这里再判一次，引用的 commit 确实落在该 tag 上。
        # 防的是「tag 被事后移动」——那种情况下的产物对不上版本号。
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WorkBaby ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # 同名资产允许覆盖：同一版本号完善问题会重推 tag
          overwrite_files: true
          files: build/bin/WorkBaby-amd64-installer.exe