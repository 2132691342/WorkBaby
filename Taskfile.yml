version: '3'

# 项目级任务入口。开发期的日常命令都收口到这里，不散落在文档里的裸 go 命令。

vars:
  APP_NAME: "WorkBaby"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # 只面向 Windows：不做 GOOS 派发，也没有 darwin/linux/android/ios 的 include。
  GOOS: "windows"

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

tasks:
  build:
    summary: 构建可执行文件（bin\WorkBaby.exe）
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: 构建并打成 NSIS 安装包
    cmds:
      - task: "{{.GOOS}}:package"
        vars:
          INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "user"}}'
    vars:
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "user"}}'

  run:
    summary: 跑构建产物
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: 开发态：后端热重载 + Vite 热更
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  generate:bindings:
    summary: 生成前端绑定
    cmds:
      - task: common:generate:bindings

  icons:
    summary: 重生成全套图标（改主稿或字标后跑一次，产物一起提交）
    cmds:
      - task: common:icons

  fmt:
    summary: 格式化全部 Go 代码
    cmds:
      - gofmt -w backend main.go tests

  fmt:check:
    summary: 校验格式化（CI 用）
    shell: pwsh
    cmds:
      - |
        $bad = gofmt -l backend main.go tests
        if ($bad) { Write-Host "未格式化:"; Write-Host $bad; exit 1 }

  test:
    summary: 跑场景测试（长链路，秒级）
    cmds:
      - go test ./tests -count=1

  smoke:
    summary: 起纯后端实例，把全部只读接口打一遍（验接线，不验业务）
    cmds:
      - pwsh scripts/smoke.ps1

  i18n:
    summary: 校验前端文案能被 vue-i18n 编译（@ % | 等保留字须转义）
    cmds:
      - npm --prefix frontend run check:i18n

  ts:check:
    summary: 前端类型检查（要先有生成绑定：跑过 task build 或 generate:bindings）
    dir: frontend
    cmds:
      - npx vue-tsc --noEmit -p tsconfig.json

  # 一条命令跑完本地门禁。改完东西想知道「有没有弄坏什么」就跑这个。
  # go vet 要编译 package main，frontend\dist 与 frontend\bindings 必须先就位（先跑 task build）。
  check:
    summary: 跑全部本地门禁（格式 / 静态检查 / 场景测试 / 前端类型 / 前端文案）
    cmds:
      - task: fmt:check
      - task: vet
      - task: test
      - task: ts:check
      - task: i18n

  vet:
    summary: 静态检查
    cmds:
      - go vet ./...
